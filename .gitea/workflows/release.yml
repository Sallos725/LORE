name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - uses: https://github.com/actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sh scripts/validate.sh
      - name: Build version-matched assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package.py --tag "$RELEASE_TAG"
      - run: python3 scripts/check-package.py
      - run: docker build -t lore:ci-smoke .
      - run: python3 scripts/check-container.py --image lore:ci-smoke
      - uses: https://github.com/docker/setup-qemu-action@v3
      - uses: https://github.com/docker/setup-buildx-action@v3
      - uses: https://github.com/docker/login-action@v3
        with:
          registry: gitea.grantos.m1ndb3nd3r.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: gitea.grantos.m1ndb3nd3r.com/m1ndb3nd3r/lore:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://gitea.grantos.m1ndb3nd3r.com/M1NDB3ND3R/lore
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish release assets
        env:
          RELEASE_FORGE: gitea
          RELEASE_API_URL: https://gitea.grantos.m1ndb3nd3r.com/api/v1
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/publish.py
