name: Promote latest
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published version matching package.json (for example v0.1.0-alpha.3)
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: lore-container-release
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,tagName > /tmp/lore-release.json
          python3 -c 'import json,os; r=json.load(open("/tmp/lore-release.json")); assert not r["isDraft"] and r["tagName"] == os.environ["RELEASE_TAG"]'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote and verify both architectures
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/promote-image.py --image ghcr.io/sallos725/lore --tag "$RELEASE_TAG"
      - name: Verify latest can be pulled
        run: docker pull ghcr.io/sallos725/lore:latest
