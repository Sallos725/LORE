name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
concurrency:
  group: lore-container-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: sh scripts/validate.sh
      - name: Build version-matched assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package.py --tag "$RELEASE_TAG"
      - run: python3 scripts/check-package.py
      - run: docker build -t lore:ci-smoke .
      - run: python3 scripts/check-container.py --image lore:ci-smoke
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sallos725/lore:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/Sallos725/lore
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify published image platforms
        env:
          RELEASE_IMAGE: ghcr.io/sallos725/lore:${{ github.ref_name }}
        run: |
          docker buildx imagetools inspect "$RELEASE_IMAGE"
          docker buildx imagetools inspect --raw "$RELEASE_IMAGE" > /tmp/lore-image-manifest.json
          python3 -c 'import json; m=json.load(open("/tmp/lore-image-manifest.json")); p={x["platform"]["architecture"] for x in m["manifests"]}; assert {"amd64","arm64"} <= p, p'
      - name: Publish release assets
        env:
          RELEASE_FORGE: github
          RELEASE_API_URL: https://api.github.com
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/publish.py
      - name: Update latest after successful release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/promote-image.py --image ghcr.io/sallos725/lore --tag "$RELEASE_TAG"
