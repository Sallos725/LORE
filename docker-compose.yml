services:
  lore:
    image: ${LORE_IMAGE:-ghcr.io/sallos725/lore}:${LORE_VERSION:-latest}
    build: .
    environment:
      LORE_POCKETRISU_URL: ${LORE_POCKETRISU_URL:?Set the existing PocketRisu origin in .env}
      LORE_LLM_PROVIDER: ${LORE_LLM_PROVIDER:-custom}
      LORE_LLM_URL: ${LORE_LLM_URL:-}
      LORE_LLM_MODEL: ${LORE_LLM_MODEL:-}
      LORE_LLM_API_KEY: ${LORE_LLM_API_KEY:-}
      LORE_LLM_TIMEOUT_MS: ${LORE_LLM_TIMEOUT_MS:-45000}
      LORE_LLM_JSON_MODE: ${LORE_LLM_JSON_MODE:-false}
    volumes:
      - lore-data:/data
    expose:
      - "6011"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    init: true
volumes:
  lore-data:
